name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  cpu-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-m1.txt
      - run: python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-m1.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check src/training/pilot.py src/training/smoke.py src/data/provenance.py tests/test_m2.py
