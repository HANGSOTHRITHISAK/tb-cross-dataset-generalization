project:
  name: tb-cross-dataset-generalization
  task: binary_classification
  positive_class: tuberculosis

seed: 42

data:
  image_size: 224
  channels: 3
  train_dataset: null
  external_test_datasets: []
  patient_level_split: true
  normalize: imagenet

model:
  architecture: densenet121
  pretrained: true
  num_classes: 1

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  early_stopping_patience: 5

evaluation:
  threshold: 0.5
  metrics:
    - auroc
    - sensitivity
    - specificity
    - precision
    - f1
    - confusion_matrix

notes: >-
  Placeholder baseline configuration. Dataset-specific values should be filled in
  only after the dataset audit and split protocol are finalized.
